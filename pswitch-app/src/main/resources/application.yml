spring:
  application:
    name: switch
  output:
    ansi:
      enabled: always
  data:
    mongodb:
      uri: mongodb://localhost:27017/switch
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

# Nenhuma conexão TCP é aberta aqui — POS, Visa e HSM são todos atendidos pelo processo separado
# pswitch-comunicacao, via filas Redis. Ver docs/arquitetura/topologia-implantacao.md.
pswitch:
  hsm:
    response-timeout: ${PSWITCH_HSM_RESPONSE_TIMEOUT:5s}

  visa:
    response-timeout: ${PSWITCH_VISA_RESPONSE_TIMEOUT:10s}
    timeout-sweep-interval: ${PSWITCH_VISA_TIMEOUT_SWEEP_INTERVAL_MS:1000}
